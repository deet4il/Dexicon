<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0F1217" />
  <title>Dexicon</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    :root {
      --bg: #0f1217;
      --card-bg: #161b22;
      --card-border: #21262d;
      --accent-red: #ea384d;
      --accent-blue: #388bea;
      --accent-green: #3fb950;
      --accent-yellow: #f1b738;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --border-subtle: #30363d;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 3rem;
    }

    .container {
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Pokedex Top Header */
    .pokedex-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--card-border);
      padding-bottom: 0.85rem;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .avatar-frame {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      background: #0d1117;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 8px rgba(234, 56, 77, 0.25);
    }

    .avatar-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-meta {
      display: flex;
      flex-direction: column;
    }

    .app-title {
      font-family: var(--font-mono);
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--text-main);
      line-height: 1.1;
    }

    .app-subtitle {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.4rem;
    }

    .small-leds {
      display: flex;
      gap: 0.35rem;
    }

    .led {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }
    .led-red { background: var(--accent-red); box-shadow: 0 0 5px var(--accent-red); }
    .led-yellow { background: var(--accent-yellow); box-shadow: 0 0 5px var(--accent-yellow); }
    .led-green { background: var(--accent-green); box-shadow: 0 0 5px var(--accent-green); }

    .dex-id {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    /* Tab Switcher */
    .tab-bar {
      display: flex;
      gap: 0.5rem;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 0.5rem;
    }

    .tab-btn {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: all 0.15s ease;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--text-main);
      border-color: var(--border-subtle);
    }

    /* Screen / Main Card */
    .dex-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .badge-group {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .type-badge {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      text-transform: uppercase;
      padding: 0.18rem 0.5rem;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }
    .badge-phil { background: rgba(234, 56, 77, 0.15); color: var(--accent-red); border: 1px solid rgba(234, 56, 77, 0.4); }
    .badge-region { background: rgba(56, 139, 234, 0.15); color: var(--accent-blue); border: 1px solid rgba(56, 139, 234, 0.4); }

    .date-stamp {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .quote-content {
      font-size: 1.15rem;
      line-height: 1.6;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 1.1rem;
    }

    .quote-attribution {
      font-size: 0.85rem;
      color: var(--text-muted);
      border-left: 2px solid var(--accent-red);
      padding-left: 0.75rem;
      margin-bottom: 1rem;
    }

    .quote-attribution .author {
      color: var(--text-main);
      font-weight: 600;
    }

    .quote-context {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-style: italic;
      line-height: 1.45;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 6px;
      padding: 0.65rem 0.8rem;
    }

    /* Reflection Editor */
    .journal-section {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .section-label {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-indicator {
      font-size: 0.68rem;
      color: var(--accent-green);
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .status-indicator.visible { opacity: 1; }

    textarea {
      width: 100%;
      height: 130px;
      background: #0d1117;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 0.95rem;
      line-height: 1.55;
      padding: 0.9rem;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus { border-color: var(--accent-blue); }
    textarea::placeholder { color: #484f58; }

    /* Controls & Footer */
    .footer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .btn {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      border: 1px solid var(--border-subtle);
      background: var(--card-bg);
      color: var(--text-main);
      padding: 0.6rem 0.95rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #21262d; }

    /* Archive / Database Explorer */
    .archive-controls {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      background: var(--card-bg);
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }

    .search-input {
      width: 100%;
      padding: 0.6rem 0.8rem;
      background: #0d1117;
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 0.85rem;
      outline: none;
    }

    .filters-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .filter-select {
      background: #0d1117;
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      padding: 0.4rem 0.6rem;
      border-radius: 4px;
      outline: none;
    }

    .archive-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }

    .archive-card {
      background: #11151b;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .archive-card .author-line {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .archive-card .quote-body {
      font-size: 0.92rem;
      font-style: italic;
      color: #c9d1d9;
      line-height: 1.5;
    }

    .reflect-this-btn {
      align-self: flex-start;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      padding: 0.35rem 0.65rem;
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--accent-blue);
      border-radius: 4px;
      cursor: pointer;
    }
    .reflect-this-btn:hover {
      background: rgba(56, 139, 234, 0.1);
    }

    /* History Feed */
    .history-drawer {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin-top: 0.5rem;
    }

    .history-item {
      background: #11151b;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.9rem;
      font-size: 0.82rem;
    }

    .history-item .hist-header {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    .history-item .hist-quote {
      font-style: italic;
      color: #c9d1d9;
      margin-bottom: 0.4rem;
    }

    .app-credits-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: #484f58;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="pokedex-header">
      <div class="header-left">
        <div class="avatar-frame">
          <img src="icon-192.png" alt="Dexicon Icon" />
        </div>
        <div class="brand-meta">
          <div class="app-title">DEXICON</div>
          <div class="app-subtitle">Created by DCA</div>
        </div>
      </div>
      <div class="header-right">
        <div class="small-leds">
          <div class="led led-red"></div>
          <div class="led led-yellow"></div>
          <div class="led led-green"></div>
        </div>
        <div class="dex-id" id="dexId">ENTRY #---</div>
      </div>
    </header>

    <!-- Section Navigation -->
    <nav class="tab-bar">
      <button class="tab-btn active" id="tabDaily">Daily Entry</button>
      <button class="tab-btn" id="tabCatalog">Archive Codex</button>
    </nav>

    <!-- VIEW 1: Daily Focus -->
    <div id="viewDaily" style="display: flex; flex-direction: column; gap: 1.25rem;">
      <main class="dex-card">
        <div class="card-meta">
          <div class="badge-group">
            <span class="type-badge badge-phil" id="quotePhil">PHILOSOPHY</span>
            <span class="type-badge badge-region" id="quoteRegion">REGION</span>
          </div>
          <span class="date-stamp" id="todayDate">----.--.--</span>
        </div>

        <div class="quote-content" id="quoteText">Loading entry...</div>

        <div class="quote-attribution">
          <span class="author" id="quoteAuthor">---</span><br />
          <span id="quoteSource">---</span>
        </div>

        <div class="quote-context" id="quoteContext">---</div>
      </main>

      <section class="journal-section">
        <div class="section-label">
          <span>TRAINER'S LOG // TODAY</span>
          <span class="status-indicator" id="saveStatus">SYNCED</span>
        </div>
        <textarea id="reflectionInput" placeholder="Record your observations, applications, or thoughts..."></textarea>
      </section>

      <div class="footer-actions">
        <button class="btn" id="toggleHistoryBtn">View Past Logs</button>
        <button class="btn" id="exportBtn">Export JSON</button>
      </div>

      <div class="history-drawer" id="historyDrawer" style="display: none;"></div>
    </div>

    <!-- VIEW 2: Archive / Database Catalog -->
    <div id="viewCatalog" style="display: none; flex-direction: column; gap: 1rem;">
      <div class="archive-controls">
        <input type="text" id="archiveSearch" class="search-input" placeholder="Search author, keyword, or text..." />
        <div class="filters-row">
          <select id="regionFilter" class="filter-select">
            <option value="ALL">All Regions</option>
          </select>
          <select id="philFilter" class="filter-select">
            <option value="ALL">All Philosophies</option>
          </select>
        </div>
      </div>

      <div class="archive-list" id="archiveList"></div>
    </div>

    <footer class="app-credits-footer">
      Dexicon &bull; Created by DCA
    </footer>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      });
    }

    // Extended Database with Dostoevsky, Nicholas Sparks, Stoics, Regional Wisdom
    const quotes = [
      {
        quote: "To love someone is to see them as God intended them.",
        author: "Fyodor Dostoevsky",
        source: "The Brothers Karamazov",
        tradition: "Existential / Christian",
        region: "Russia",
        context: "19th-century psychological masterpiece framing unconditional love not as sentimentality, but as spiritual perception."
      },
      {
        quote: "Love is like the wind, you can't see it with your eyes, but you can feel it with your whole heart.",
        author: "Nicholas Sparks",
        source: "A Walk to Remember",
        tradition: "Romanticism",
        region: "North America",
        context: "Modern reflection examining invisible emotional realities that direct human choices and purpose."
      },
      {
        quote: "You have power over your mind - not outside events. Realize this, and you will find strength.",
        author: "Marcus Aurelius",
        source: "Meditations, Book IV",
        tradition: "Stoicism",
        region: "Greco-Roman",
        context: "Private wartime battlefield journal on maintaining composure despite external chaos."
      },
      {
        quote: "We suffer more often in imagination than in reality.",
        author: "Seneca the Younger",
        source: "Letters from a Stoic",
        tradition: "Stoicism",
        region: "Greco-Roman",
        context: "Stoic counsel warning against premature anxiety and catastrophic anticipation."
      },
      {
        quote: "The journey of a thousand miles begins with a single step.",
        author: "Laozi",
        source: "Dao De Jing, Chapter 64",
        tradition: "Daoism",
        region: "China",
        context: "Classical Daoist principle of effortless momentum and compound growth from modest actions."
      },
      {
        quote: "To everything there is a season, and a time to every purpose under the heaven.",
        author: "Ecclesiastes 3:1",
        source: "The Hebrew Bible / Tanakh",
        tradition: "Wisdom Literature",
        region: "Middle East",
        context: "Ancient meditative text embracing cyclical rhythms between seasons of labor and rest."
      },
      {
        quote: "The wound is the place where the Light enters you.",
        author: "Jalal al-Din Muhammad Rumi",
        source: "The Masnavi",
        tradition: "Sufism",
        region: "Middle East",
        context: "13th-century mystical verse reframing vulnerability and suffering as catalysts for maturity."
      },
      {
        quote: "If you want to go fast, go alone. If you want to go far, go together.",
        author: "Traditional Proverb",
        source: "Oral Tradition",
        tradition: "Ubuntu / Communal",
        region: "Africa",
        context: "Enduring wisdom emphasizing communal endurance over brief, solitary bursts of effort."
      },
      {
        quote: "Ang hindi marunong lumingon sa pinanggalingan ay hindi makakarating sa paroroonan.",
        author: "Traditional Proverb",
        source: "Philippine Folk Wisdom",
        tradition: "Folk Philosophy",
        region: "Philippines",
        context: "Root-awareness and gratitude as foundational guideposts before charting new horizons."
      },
      {
        quote: "We are what we repeatedly do. Excellence, then, is not an act, but a habit.",
        author: "Will Durant (interpreting Aristotle)",
        source: "The Story of Philosophy",
        tradition: "Classical Virtue",
        region: "Greco-Roman",
        context: "Synthesizes the ancient concept of 'arete' (virtue) as practical daily conditioning."
      }
    ];

    function getTodayKey() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    function getDeterministicQuote(dateStr) {
      let hash = 0;
      for (let i = 0; i < dateStr.length; i++) {
        hash = (hash << 5) - hash + dateStr.charCodeAt(i);
        hash |= 0;
      }
      const index = Math.abs(hash) % quotes.length;
      return { quote: quotes[index], index: index + 1 };
    }

    // Set Daily View
    const todayKey = getTodayKey();
    let activeQuoteData = getDeterministicQuote(todayKey);

    function displayQuote(entry, num) {
      document.getElementById('dexId').textContent = `DEX ENTRY #${String(num).padStart(3, '0')}`;
      document.getElementById('quotePhil').textContent = entry.tradition;
      document.getElementById('quoteRegion').textContent = entry.region;
      document.getElementById('quoteText').textContent = `"${entry.quote}"`;
      document.getElementById('quoteAuthor').textContent = entry.author;
      document.getElementById('quoteSource').textContent = entry.source;
      document.getElementById('quoteContext').textContent = entry.context;
    }

    document.getElementById('todayDate').textContent = todayKey.replace(/-/g, '.');
    displayQuote(activeQuoteData.quote, activeQuoteData.index);

    // Persistence & Auto-save
    const storageKey = `dexicon_${todayKey}`;
    const textarea = document.getElementById('reflectionInput');
    const saveStatus = document.getElementById('saveStatus');

    textarea.value = localStorage.getItem(storageKey) || '';

    let timeoutId;
    textarea.addEventListener('input', () => {
      saveStatus.textContent = 'SAVING...';
      saveStatus.classList.add('visible');
      clearTimeout(timeoutId);

      timeoutId = setTimeout(() => {
        localStorage.setItem(storageKey, textarea.value);
        saveStatus.textContent = 'SAVED';
        setTimeout(() => saveStatus.classList.remove('visible'), 1200);
      }, 400);
    });

    // Tab Navigation
    const tabDaily = document.getElementById('tabDaily');
    const tabCatalog = document.getElementById('tabCatalog');
    const viewDaily = document.getElementById('viewDaily');
    const viewCatalog = document.getElementById('viewCatalog');

    tabDaily.addEventListener('click', () => {
      tabDaily.classList.add('active');
      tabCatalog.classList.remove('active');
      viewDaily.style.display = 'flex';
      viewCatalog.style.display = 'none';
    });

    tabCatalog.addEventListener('click', () => {
      tabCatalog.classList.add('active');
      tabDaily.classList.remove('active');
      viewDaily.style.display = 'none';
      viewCatalog.style.display = 'flex';
      renderArchive();
    });

    // Populate Filters
    const regionFilter = document.getElementById('regionFilter');
    const philFilter = document.getElementById('philFilter');

    const uniqueRegions = [...new Set(quotes.map(q => q.region))].sort();
    const uniquePhils = [...new Set(quotes.map(q => q.tradition))].sort();

    uniqueRegions.forEach(r => {
      const opt = document.createElement('option');
      opt.value = r; opt.textContent = r;
      regionFilter.appendChild(opt);
    });

    uniquePhils.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p; opt.textContent = p;
      philFilter.appendChild(opt);
    });

    // Archive Search & Filter
    const searchInput = document.getElementById('archiveSearch');
    const archiveList = document.getElementById('archiveList');

    searchInput.addEventListener('input', renderArchive);
    regionFilter.addEventListener('change', renderArchive);
    philFilter.addEventListener('change', renderArchive);

    function renderArchive() {
      const query = searchInput.value.toLowerCase();
      const selRegion = regionFilter.value;
      const selPhil = philFilter.value;

      archiveList.innerHTML = '';

      const filtered = quotes.filter((q, idx) => {
        const matchesQuery = q.quote.toLowerCase().includes(query) ||
                             q.author.toLowerCase().includes(query) ||
                             q.source.toLowerCase().includes(query);
        const matchesRegion = (selRegion === 'ALL' || q.region === selRegion);
        const matchesPhil = (selPhil === 'ALL' || q.tradition === selPhil);
        return matchesQuery && matchesRegion && matchesPhil;
      });

      if (filtered.length === 0) {
        archiveList.innerHTML = '<div style="font-size:0.75rem; color:var(--text-muted); font-family:var(--font-mono); padding:1rem 0;">No matching entries found in the Dexicon archives.</div>';
        return;
      }

      filtered.forEach(q => {
        const globalIndex = quotes.indexOf(q) + 1;
        const card = document.createElement('div');
        card.className = 'archive-card';
        card.innerHTML = `
          <div class="author-line">
            <span>${q.author}</span>
            <div class="badge-group">
              <span class="type-badge badge-phil">${q.tradition}</span>
              <span class="type-badge badge-region">${q.region}</span>
            </div>
          </div>
          <div class="quote-body">"${q.quote}"</div>
          <div style="font-size:0.75rem; color:var(--text-muted);">${q.source}</div>
          <button class="reflect-this-btn" data-index="${globalIndex}">Reflect on this</button>
        `;

        card.querySelector('.reflect-this-btn').addEventListener('click', () => {
          displayQuote(q, globalIndex);
          tabDaily.click();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        archiveList.appendChild(card);
      });
    }

    // Past Logs Drawer
    const historyBtn = document.getElementById('toggleHistoryBtn');
    const historyDrawer = document.getElementById('historyDrawer');

    historyBtn.addEventListener('click', () => {
      if (historyDrawer.style.display === 'none') {
        renderHistory();
        historyDrawer.style.display = 'flex';
        historyBtn.textContent = 'Hide Past Logs';
      } else {
        historyDrawer.style.display = 'none';
        historyBtn.textContent = 'View Past Logs';
      }
    });

    function renderHistory() {
      historyDrawer.innerHTML = '';
      const keys = Object.keys(localStorage)
        .filter(k => k.startsWith('dexicon_'))
        .sort().reverse();

      if (keys.length === 0) {
        historyDrawer.innerHTML = '<div style="font-size:0.75rem; color:var(--text-muted); font-family:var(--font-mono); padding: 0.5rem 0;">No logs found yet. Write today\'s entry above!</div>';
        return;
      }

      keys.forEach(k => {
        const date = k.replace('dexicon_', '');
        const note = localStorage.getItem(k);
        if (!note.trim()) return;
        const { quote } = getDeterministicQuote(date);

        const card = document.createElement('div');
        card.className = 'history-item';
        card.innerHTML = `
          <div class="hist-header">
            <span>${date}</span>
            <span>${quote.author}</span>
          </div>
          <div class="hist-quote">"${quote.quote}"</div>
          <div style="color:var(--text-main); white-space:pre-wrap;">${escapeHtml(note)}</div>
        `;
        historyDrawer.appendChild(card);
      });
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    // Export Backup
    document.getElementById('exportBtn').addEventListener('click', () => {
      const exportData = {};
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('dexicon_')) {
          exportData[key.replace('dexicon_', '')] = localStorage.getItem(key);
        }
      }
      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `dexicon-backup-${todayKey}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
