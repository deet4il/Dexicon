<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0F1217" />
  <title>Dexicon</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    :root {
      --bg: #0f1217;
      --card-bg: #161b22;
      --card-border: #21262d;
      --accent-red: #ea384d;
      --accent-blue: #388bea;
      --accent-green: #3fb950;
      --accent-yellow: #f1b738;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --border-subtle: #30363d;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 3rem;
    }

    .container {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Pokedex Top Header */
    .pokedex-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--card-border);
      padding-bottom: 0.85rem;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .avatar-frame {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      background: #0d1117;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 8px rgba(234, 56, 77, 0.25);
    }

    .avatar-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-meta {
      display: flex;
      flex-direction: column;
    }

    .app-title {
      font-family: var(--font-mono);
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--text-main);
      line-height: 1.1;
    }

    .app-subtitle {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.4rem;
    }

    .small-leds {
      display: flex;
      gap: 0.35rem;
    }

    .led {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }
    .led-red { background: var(--accent-red); box-shadow: 0 0 5px var(--accent-red); }
    .led-yellow { background: var(--accent-yellow); box-shadow: 0 0 5px var(--accent-yellow); }
    .led-green { background: var(--accent-green); box-shadow: 0 0 5px var(--accent-green); }

    .dex-id {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    /* Tabs */
    .tab-bar {
      display: flex;
      gap: 0.5rem;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 0.5rem;
    }

    .tab-btn {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: all 0.15s ease;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--text-main);
      border-color: var(--border-subtle);
    }

    /* Cards */
    .dex-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.1rem;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .badge-group {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .type-badge {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      text-transform: uppercase;
      padding: 0.18rem 0.5rem;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }
    .badge-phil { background: rgba(234, 56, 77, 0.15); color: var(--accent-red); border: 1px solid rgba(234, 56, 77, 0.4); }
    .badge-region { background: rgba(56, 139, 234, 0.15); color: var(--accent-blue); border: 1px solid rgba(56, 139, 234, 0.4); }

    .date-stamp {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .quote-content {
      font-size: 1.15rem;
      line-height: 1.6;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 1.1rem;
    }

    .quote-attribution {
      font-size: 0.85rem;
      color: var(--text-muted);
      border-left: 2px solid var(--accent-red);
      padding-left: 0.75rem;
      margin-bottom: 1rem;
    }

    .quote-attribution .author {
      color: var(--text-main);
      font-weight: 600;
    }

    .quote-context {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-style: italic;
      line-height: 1.45;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 6px;
      padding: 0.65rem 0.8rem;
    }

    /* Journal Workspace */
    .journal-section {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .section-label {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-indicator {
      font-size: 0.68rem;
      color: var(--accent-green);
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .status-indicator.visible { opacity: 1; }

    textarea {
      width: 100%;
      height: 130px;
      background: #0d1117;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 0.95rem;
      line-height: 1.55;
      padding: 0.9rem;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus { border-color: var(--accent-blue); }

    /* Controls */
    .footer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .btn {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      border: 1px solid var(--border-subtle);
      background: var(--card-bg);
      color: var(--text-main);
      padding: 0.6rem 0.95rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #21262d; }

    /* Codex Feed (Scrollable List) */
    .codex-controls {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      background: var(--card-bg);
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }

    .search-input {
      width: 100%;
      padding: 0.6rem 0.8rem;
      background: #0d1117;
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 0.85rem;
      outline: none;
    }

    .feed-container {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .quote-scroll-item {
      background: #11151b;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .quote-scroll-item .author-line {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .quote-scroll-item .body-text {
      font-size: 0.92rem;
      font-style: italic;
      color: #c9d1d9;
      line-height: 1.5;
    }

    .reflect-action-btn {
      align-self: flex-start;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      padding: 0.35rem 0.65rem;
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--accent-blue);
      border-radius: 4px;
      cursor: pointer;
    }
    .reflect-action-btn:hover {
      background: rgba(56, 139, 234, 0.1);
    }

    .load-more-btn {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 0.75rem;
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
    }

    .history-drawer {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin-top: 0.5rem;
    }

    .history-item {
      background: #11151b;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.9rem;
      font-size: 0.82rem;
    }

    .app-credits-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: #484f58;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="pokedex-header">
      <div class="header-left">
        <div class="avatar-frame">
          <img src="icon-192.png" alt="Dexicon Icon" />
        </div>
        <div class="brand-meta">
          <div class="app-title">DEXICON</div>
          <div class="app-subtitle">Created by DCA</div>
        </div>
      </div>
      <div class="header-right">
        <div class="small-leds">
          <div class="led led-red"></div>
          <div class="led led-yellow"></div>
          <div class="led led-green"></div>
        </div>
        <div class="dex-id" id="dexId">ENTRY #---</div>
      </div>
    </header>

    <!-- Navigation -->
    <nav class="tab-bar">
      <button class="tab-btn active" id="tabDaily">Daily Resonance</button>
      <button class="tab-btn" id="tabCodex">World Codex (Scroll)</button>
    </nav>

    <!-- VIEW 1: Daily Focus -->
    <div id="viewDaily" style="display: flex; flex-direction: column; gap: 1.25rem;">
      <main class="dex-card">
        <div class="card-meta">
          <div class="badge-group">
            <span class="type-badge badge-phil" id="quotePhil">PHILOSOPHY</span>
            <span class="type-badge badge-region" id="quoteRegion">REGION</span>
          </div>
          <span class="date-stamp" id="todayDate">----.--.--</span>
        </div>

        <div class="quote-content" id="quoteText">Loading entry...</div>

        <div class="quote-attribution">
          <span class="author" id="quoteAuthor">---</span><br />
          <span id="quoteSource">---</span>
        </div>

        <div class="quote-context" id="quoteContext">---</div>
      </main>

      <section class="journal-section">
        <div class="section-label">
          <span>TRAINER'S LOG // TODAY</span>
          <span class="status-indicator" id="saveStatus">SYNCED</span>
        </div>
        <textarea id="reflectionInput" placeholder="Record your observations, applications, or thoughts..."></textarea>
      </section>

      <div class="footer-actions">
        <button class="btn" id="toggleHistoryBtn">View Past Logs</button>
        <button class="btn" id="exportBtn">Export JSON</button>
      </div>

      <div class="history-drawer" id="historyDrawer" style="display: none;"></div>
    </div>

    <!-- VIEW 2: Infinite / Online World Codex -->
    <div id="viewCodex" style="display: none; flex-direction: column; gap: 1rem;">
      <div class="codex-controls">
        <input type="text" id="codexSearch" class="search-input" placeholder="Filter through loaded quotes or authors..." />
        <div style="font-size:0.7rem; color:var(--text-muted); font-family:var(--font-mono);" id="onlineStatusNotice">
          CONNECTED TO GLOBAL REPOSITORIES
        </div>
      </div>

      <div class="feed-container" id="feedContainer"></div>
      <button class="load-more-btn" id="loadMoreBtn">Load More Quotes (+30)</button>
    </div>

    <footer class="app-credits-footer">
      Dexicon &bull; Created by DCA
    </footer>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      });
    }

    // Core offline database pool
    const coreQuotes = [
      {
        quote: "To love someone is to see them as God intended them.",
        author: "Fyodor Dostoevsky",
        source: "The Brothers Karamazov",
        tradition: "Existential / Christian",
        region: "Russia",
        context: "19th-century psychological masterpiece framing unconditional love as profound perception."
      },
      {
        quote: "Love is like the wind, you can't see it with your eyes, but you can feel it with your whole heart.",
        author: "Nicholas Sparks",
        source: "A Walk to Remember",
        tradition: "Romanticism",
        region: "North America",
        context: "Exploration of invisible convictions that govern human direction."
      },
      {
        quote: "You have power over your mind - not outside events. Realize this, and you will find strength.",
        author: "Marcus Aurelius",
        source: "Meditations, Book IV",
        tradition: "Stoicism",
        region: "Greco-Roman",
        context: "Private wartime reflections on personal discipline and emotional sovereignty."
      },
      {
        quote: "We suffer more often in imagination than in reality.",
        author: "Seneca the Younger",
        source: "Letters from a Stoic",
        tradition: "Stoicism",
        region: "Greco-Roman",
        context: "Stoic warning against premature dread and invented catastrophe."
      },
      {
        quote: "The journey of a thousand miles begins with a single step.",
        author: "Laozi",
        source: "Dao De Jing, Chapter 64",
        tradition: "Daoism",
        region: "China",
        context: "Principles of compound momentum and modest beginnings."
      },
      {
        quote: "To everything there is a season, and a time to every purpose under the heaven.",
        author: "Ecclesiastes 3:1",
        source: "The Hebrew Bible / Tanakh",
        tradition: "Wisdom Literature",
        region: "Middle East",
        context: "Meditative literature acknowledging rhythmic phases of labor, rest, and renewal."
      },
      {
        quote: "The wound is the place where the Light enters you.",
        author: "Jalal al-Din Muhammad Rumi",
        source: "The Masnavi",
        tradition: "Sufism",
        region: "Middle East",
        context: "Adversity and vulnerability recontextualized as the doorway to wisdom."
      },
      {
        quote: "If you want to go fast, go alone. If you want to go far, go together.",
        author: "Traditional Proverb",
        source: "Oral Tradition",
        tradition: "Ubuntu / Communal",
        region: "Africa",
        context: "Community solidarity over solitary speed."
      },
      {
        quote: "Ang hindi marunong lumingon sa pinanggalingan ay hindi makakarating sa paroroonan.",
        author: "Traditional Proverb",
        source: "Philippine Folk Wisdom",
        tradition: "Folk Philosophy",
        region: "Philippines",
        context: "Root-awareness as the prerequisite for progress."
      },
      {
        quote: "We are what we repeatedly do. Excellence, then, is not an act, but a habit.",
        author: "Will Durant (interpreting Aristotle)",
        source: "The Story of Philosophy",
        tradition: "Classical Virtue",
        region: "Greco-Roman",
        context: "Character and virtue as active habituation."
      }
    ];

    function getTodayKey() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    function getDeterministicQuote(dateStr) {
      let hash = 0;
      for (let i = 0; i < dateStr.length; i++) {
        hash = (hash << 5) - hash + dateStr.charCodeAt(i);
        hash |= 0;
      }
      const index = Math.abs(hash) % coreQuotes.length;
      return { quote: coreQuotes[index], index: index + 1 };
    }

    // Set Daily Screen
    const todayKey = getTodayKey();
    const activeDaily = getDeterministicQuote(todayKey);

    function displayDaily(entry, num) {
      document.getElementById('dexId').textContent = `DEX ENTRY #${String(num).padStart(3, '0')}`;
      document.getElementById('quotePhil').textContent = entry.tradition || "PHILOSOPHY";
      document.getElementById('quoteRegion').textContent = entry.region || "GLOBAL";
      document.getElementById('quoteText').textContent = `"${entry.quote}"`;
      document.getElementById('quoteAuthor').textContent = entry.author;
      document.getElementById('quoteSource').textContent = entry.source || "World Wisdom";
      document.getElementById('quoteContext').textContent = entry.context || "Selected from the global index.";
    }

    document.getElementById('todayDate').textContent = todayKey.replace(/-/g, '.');
    displayDaily(activeDaily.quote, activeDaily.index);

    // Save & Typing Logic
    const storageKey = `dexicon_${todayKey}`;
    const textarea = document.getElementById('reflectionInput');
    const saveStatus = document.getElementById('saveStatus');

    textarea.value = localStorage.getItem(storageKey) || '';

    let timeoutId;
    textarea.addEventListener('input', () => {
      saveStatus.textContent = 'SAVING...';
      saveStatus.classList.add('visible');
      clearTimeout(timeoutId);

      timeoutId = setTimeout(() => {
        localStorage.setItem(storageKey, textarea.value);
        saveStatus.textContent = 'SAVED';
        setTimeout(() => saveStatus.classList.remove('visible'), 1200);
      }, 400);
    });

    // View Switching
    const tabDaily = document.getElementById('tabDaily');
    const tabCodex = document.getElementById('tabCodex');
    const viewDaily = document.getElementById('viewDaily');
    const viewCodex = document.getElementById('viewCodex');

    tabDaily.addEventListener('click', () => {
      tabDaily.classList.add('active');
      tabCodex.classList.remove('active');
      viewDaily.style.display = 'flex';
      viewCodex.style.display = 'none';
    });

    tabCodex.addEventListener('click', () => {
      tabCodex.classList.add('active');
      tabDaily.classList.remove('active');
      viewDaily.style.display = 'none';
      viewCodex.style.display = 'flex';
      if (allCodexQuotes.length === 0) {
        initCodexFeed();
      }
    });

    // World Codex Infinite Feed Logic
    let allCodexQuotes = [];
    let currentApiSkip = 0;
    const feedContainer = document.getElementById('feedContainer');
    const loadMoreBtn = document.getElementById('loadMoreBtn');
    const codexSearch = document.getElementById('codexSearch');

    function initCodexFeed() {
      // Seed with core local quotes first
      allCodexQuotes = [...coreQuotes];
      renderCodex();
      fetchOnlineQuotes();
    }

    async function fetchOnlineQuotes() {
      const notice = document.getElementById('onlineStatusNotice');
      notice.textContent = "SYNCHRONIZING WITH WORLD DATABASE...";
      try {
        const response = await fetch(`https://dummyjson.com/quotes?limit=30&skip=${currentApiSkip}`);
        const data = await response.json();
        if (data && data.quotes) {
          const formatted = data.quotes.map(q => ({
            quote: q.quote,
            author: q.author,
            source: "World Literature / Anthology",
            tradition: "Universal",
            region: "Global",
            context: "Cataloged from international records."
          }));
          allCodexQuotes.push(...formatted);
          currentApiSkip += 30;
          notice.textContent = `ONLINE // ${allCodexQuotes.length} ENTRIES ARCHIVED`;
          renderCodex();
        }
      } catch (err) {
        notice.textContent = "OFFLINE MODE // SERVING CACHED ARCHIVES";
      }
    }

    loadMoreBtn.addEventListener('click', () => {
      fetchOnlineQuotes();
    });

    codexSearch.addEventListener('input', renderCodex);

    function renderCodex() {
      const query = codexSearch.value.toLowerCase();
      feedContainer.innerHTML = '';

      const filtered = allCodexQuotes.filter(q =>
        q.quote.toLowerCase().includes(query) || q.author.toLowerCase().includes(query)
      );

      if (filtered.length === 0) {
        feedContainer.innerHTML = '<div style="font-size:0.75rem; color:var(--text-muted); font-family:var(--font-mono); padding:1rem 0;">No matching entries found.</div>';
        return;
      }

      filtered.forEach((q, idx) => {
        const item = document.createElement('div');
        item.className = 'quote-scroll-item';
        item.innerHTML = `
          <div class="author-line">
            <span>${q.author}</span>
            <span class="type-badge badge-phil">${q.tradition || 'UNIVERSAL'}</span>
          </div>
          <div class="body-text">"${q.quote}"</div>
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:0.72rem; color:var(--text-muted);">${q.source || ''}</span>
            <button class="reflect-action-btn" data-index="${idx}">Reflect on this</button>
          </div>
        `;

        item.querySelector('.reflect-action-btn').addEventListener('click', () => {
          displayDaily(q, idx + 1);
          tabDaily.click();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        feedContainer.appendChild(item);
      });
    }

    // Past Logs Drawer
    const historyBtn = document.getElementById('toggleHistoryBtn');
    const historyDrawer = document.getElementById('historyDrawer');

    historyBtn.addEventListener('click', () => {
      if (historyDrawer.style.display === 'none') {
        renderHistory();
        historyDrawer.style.display = 'flex';
        historyBtn.textContent = 'Hide Past Logs';
      } else {
        historyDrawer.style.display = 'none';
        historyBtn.textContent = 'View Past Logs';
      }
    });

    function renderHistory() {
      historyDrawer.innerHTML = '';
      const keys = Object.keys(localStorage)
        .filter(k => k.startsWith('dexicon_'))
        .sort().reverse();

      if (keys.length === 0) {
        historyDrawer.innerHTML = '<div style="font-size:0.75rem; color:var(--text-muted); font-family:var(--font-mono); padding: 0.5rem 0;">No logs found yet. Write today\'s entry above!</div>';
        return;
      }

      keys.forEach(k => {
        const date = k.replace('dexicon_', '');
        const note = localStorage.getItem(k);
        if (!note.trim()) return;
        const { quote } = getDeterministicQuote(date);

        const card = document.createElement('div');
        card.className = 'history-item';
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:0.7rem; color:var(--text-muted); margin-bottom:0.4rem;">
            <span>${date}</span>
            <span>${quote.author}</span>
          </div>
          <div style="font-style:italic; color:#c9d1d9; font-size:0.8rem; margin-bottom:0.4rem;">"${quote.quote}"</div>
          <div style="color:var(--text-main); font-size:0.82rem; white-space:pre-wrap;">${escapeHtml(note)}</div>
        `;
        historyDrawer.appendChild(card);
      });
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    // Export Backup
    document.getElementById('exportBtn').addEventListener('click', () => {
      const exportData = {};
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('dexicon_')) {
          exportData[key.replace('dexicon_', '')] = localStorage.getItem(key);
        }
      }
      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `dexicon-backup-${todayKey}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
