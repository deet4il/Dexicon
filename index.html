<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0F1217" />
  <title>Dexicon</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    :root {
      --bg: #0f1217;
      --card-bg: #161b22;
      --card-border: #21262d;
      --accent-red: #ea384d;
      --accent-blue: #388bea;
      --accent-green: #3fb950;
      --accent-yellow: #f1b738;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --border-subtle: #30363d;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.25rem 1rem 3rem;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    /* Pokedex Top Hardware Bar */
    .pokedex-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--card-border);
      padding-bottom: 0.85rem;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .avatar-frame {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      background: #0d1117;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 8px rgba(234, 56, 77, 0.25);
    }

    .avatar-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-meta {
      display: flex;
      flex-direction: column;
    }

    .app-title {
      font-family: var(--font-mono);
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--text-main);
      line-height: 1.1;
    }

    .app-subtitle {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.4rem;
    }

    .small-leds {
      display: flex;
      gap: 0.35rem;
    }

    .led {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }
    .led-red { background: var(--accent-red); box-shadow: 0 0 5px var(--accent-red); }
    .led-yellow { background: var(--accent-yellow); box-shadow: 0 0 5px var(--accent-yellow); }
    .led-green { background: var(--accent-green); box-shadow: 0 0 5px var(--accent-green); }

    .dex-id {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    /* Tab Switcher */
    .tab-bar {
      display: flex;
      gap: 0.5rem;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 0.5rem;
    }

    .tab-btn {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: all 0.15s ease;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--text-main);
      border-color: var(--border-subtle);
    }

    /* Screen Bezel Card */
    .dex-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.4rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      position: relative;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .badge-group {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .type-badge {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      text-transform: uppercase;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }
    .badge-phil { background: rgba(234, 56, 77, 0.15); color: var(--accent-red); border: 1px solid rgba(234, 56, 77, 0.4); }
    .badge-region { background: rgba(56, 139, 234, 0.15); color: var(--accent-blue); border: 1px solid rgba(56, 139, 234, 0.4); }

    .date-stamp {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .quote-content {
      font-size: 1.18rem;
      line-height: 1.6;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 1rem;
    }

    .quote-attribution {
      font-size: 0.85rem;
      color: var(--text-muted);
      border-left: 2px solid var(--accent-red);
      padding-left: 0.75rem;
      margin-bottom: 1rem;
    }

    .quote-attribution .author {
      color: var(--text-main);
      font-weight: 600;
    }

    .quote-context {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-style: italic;
      line-height: 1.45;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 6px;
      padding: 0.65rem 0.8rem;
    }

    /* Swipeable Deck Frame */
    .deck-container {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .deck-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .deck-carousel {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 1rem;
      padding-bottom: 0.5rem;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .deck-carousel::-webkit-scrollbar { display: none; }

    .swipe-card {
      flex: 0 0 100%;
      scroll-snap-align: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.5rem;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 260px;
    }

    .swipe-card .card-body {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .swipe-card .quote-text {
      font-size: 1.15rem;
      line-height: 1.55;
      font-weight: 600;
      color: var(--text-main);
      font-style: italic;
    }

    .swipe-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.25rem;
    }

    .carousel-nav-btn {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .carousel-nav-btn:hover { background: #21262d; }

    .deck-counter {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* Reflection Editor */
    .journal-section {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .section-label {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-indicator {
      font-size: 0.68rem;
      color: var(--accent-green);
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .status-indicator.visible { opacity: 1; }

    textarea {
      width: 100%;
      height: 130px;
      background: #0d1117;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 0.95rem;
      line-height: 1.55;
      padding: 0.9rem;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus { border-color: var(--accent-blue); }

    /* Footer Controls */
    .footer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .btn {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      border: 1px solid var(--border-subtle);
      background: var(--card-bg);
      color: var(--text-main);
      padding: 0.6rem 0.95rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #21262d; }

    .reflect-action-btn {
      align-self: flex-start;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      padding: 0.4rem 0.75rem;
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--accent-blue);
      border-radius: 4px;
      cursor: pointer;
    }
    .reflect-action-btn:hover {
      background: rgba(56, 139, 234, 0.12);
    }

    .history-drawer {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin-top: 0.5rem;
    }

    .history-item {
      background: #11151b;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.9rem;
      font-size: 0.82rem;
    }

    .app-credits-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: #484f58;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="pokedex-header">
      <div class="header-left">
        <div class="avatar-frame">
          <img src="icon-192.png" alt="Dexicon Icon" />
        </div>
        <div class="brand-meta">
          <div class="app-title">DEXICON</div>
          <div class="app-subtitle">Created by DCA</div>
        </div>
      </div>
      <div class="header-right">
        <div class="small-leds">
          <div class="led led-red"></div>
          <div class="led led-yellow"></div>
          <div class="led led-green"></div>
        </div>
        <div class="dex-id" id="dexId">ENTRY #---</div>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="tab-bar">
      <button class="tab-btn active" id="tabDaily">Daily Resonance</button>
      <button class="tab-btn" id="tabCodex">World Codex (Deck)</button>
    </nav>

    <!-- VIEW 1: Daily Focus -->
    <div id="viewDaily" style="display: flex; flex-direction: column; gap: 1.2rem;">
      <main class="dex-card">
        <div class="card-meta">
          <div class="badge-group">
            <span class="type-badge badge-phil" id="quotePhil">PHILOSOPHY</span>
            <span class="type-badge badge-region" id="quoteRegion">REGION</span>
          </div>
          <span class="date-stamp" id="todayDate">----.--.--</span>
        </div>

        <div class="quote-content" id="quoteText">Loading entry...</div>

        <div class="quote-attribution">
          <span class="author" id="quoteAuthor">---</span><br />
          <span id="quoteSource">---</span>
        </div>

        <div class="quote-context" id="quoteContext">---</div>
      </main>

      <section class="journal-section">
        <div class="section-label">
          <span>TRAINER'S LOG // TODAY</span>
          <span class="status-indicator" id="saveStatus">SYNCED</span>
        </div>
        <textarea id="reflectionInput" placeholder="Record your observations, applications, or thoughts..."></textarea>
      </section>

      <div class="footer-actions">
        <button class="btn" id="toggleHistoryBtn">View Past Logs</button>
        <button class="btn" id="exportBtn">Export JSON</button>
      </div>

      <div class="history-drawer" id="historyDrawer" style="display: none;"></div>
    </div>

    <!-- VIEW 2: Infinite / Random World Deck -->
    <div id="viewCodex" style="display: none; flex-direction: column; gap: 1rem;">
      <div class="deck-container">
        <div class="deck-topbar">
          <span id="deckStatus">SHUFFLED ARCHIVES</span>
          <span class="deck-counter" id="deckCounter">1 / --</span>
        </div>

        <div class="deck-carousel" id="deckCarousel"></div>

        <div class="swipe-controls">
          <button class="carousel-nav-btn" id="prevCardBtn">&larr; Previous</button>
          <span style="font-family:var(--font-mono); font-size:0.68rem; color:var(--text-muted);">SWIPE &bull; ARROWS</span>
          <button class="carousel-nav-btn" id="nextCardBtn">Next &rarr;</button>
        </div>
      </div>
    </div>

    <footer class="app-credits-footer">
      Dexicon &bull; Created by DCA
    </footer>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      });
    }

    const coreQuotes = [
      {
        quote: "To love someone is to see them as God intended them.",
        author: "Fyodor Dostoevsky",
        source: "The Brothers Karamazov",
        tradition: "Existential / Christian",
        region: "Russia",
        context: "19th-century masterpiece framing unconditional love not as sentimentality, but as spiritual vision."
      },
      {
        quote: "Love is like the wind, you can't see it with your eyes, but you can feel it with your whole heart.",
        author: "Nicholas Sparks",
        source: "A Walk to Remember",
        tradition: "Romanticism",
        region: "North America",
        context: "Explores intangible emotional convictions that guide human purpose and devotion."
      },
      {
        quote: "You have power over your mind - not outside events. Realize this, and you will find strength.",
        author: "Marcus Aurelius",
        source: "Meditations, Book IV",
        tradition: "Stoicism",
        region: "Greco-Roman",
        context: "Private wartime journal notes on emotional sovereignty and grounded composure."
      },
      {
        quote: "We suffer more often in imagination than in reality.",
        author: "Seneca the Younger",
        source: "Letters from a Stoic",
        tradition: "Stoicism",
        region: "Greco-Roman",
        context: "Counsel against anticipatory worry and self-inflicted distress."
      },
      {
        quote: "The journey of a thousand miles begins with a single step.",
        author: "Laozi",
        source: "Dao De Jing, Chapter 64",
        tradition: "Daoism",
        region: "China",
        context: "Classical Daoist principle of effortless momentum and compound growth from modest actions."
      },
      {
        quote: "To everything there is a season, and a time to every purpose under the heaven.",
        author: "Ecclesiastes 3:1",
        source: "The Hebrew Bible / Tanakh",
        tradition: "Wisdom Literature",
        region: "Middle East",
        context: "Ancient meditative text acknowledging the cyclical shifts between labor and quiet rest."
      },
      {
        quote: "The wound is the place where the Light enters you.",
        author: "Jalal al-Din Muhammad Rumi",
        source: "The Masnavi",
        tradition: "Sufism",
        region: "Middle East",
        context: "Mystical verse reframing personal vulnerability as the gateway to deeper understanding."
      },
      {
        quote: "If you want to go fast, go alone. If you want to go far, go together.",
        author: "Traditional Proverb",
        source: "Oral Tradition",
        tradition: "Ubuntu / Communal",
        region: "Africa",
        context: "Community-centered philosophy emphasizing collective endurance over isolated bursts of speed."
      },
      {
        quote: "Ang hindi marunong lumingon sa pinanggalingan ay hindi makakarating sa paroroonan.",
        author: "Traditional Proverb",
        source: "Philippine Folk Wisdom",
        tradition: "Folk Philosophy",
        region: "Philippines",
        context: "Root-awareness and gratitude as foundational anchors before advancing forward."
      },
      {
        quote: "We are what we repeatedly do. Excellence, then, is not an act, but a habit.",
        author: "Will Durant (interpreting Aristotle)",
        source: "The Story of Philosophy",
        tradition: "Classical Virtue",
        region: "Greco-Roman",
        context: "Frames human virtue as continuous active habituation rather than abstract theory."
      }
    ];

    function getTodayKey() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    // --- LOCK-IN ENGINE FOR DAILY LOGS ---
    // Reads or permanently assigns a quote for a specific date
    function getLockedRecordForDate(dateStr) {
      const recordKey = `dexicon_entry_${dateStr}`;
      const raw = localStorage.getItem(recordKey);

      if (raw) {
        try {
          return JSON.parse(raw);
        } catch (e) {}
      }

      // Check legacy format (plain string note from older versions)
      const oldRaw = localStorage.getItem(`dexicon_${dateStr}`);
      let existingNote = '';
      if (oldRaw) {
        try {
          const parsed = JSON.parse(oldRaw);
          existingNote = parsed.note || '';
        } catch(e) {
          existingNote = oldRaw; // was raw plain text
        }
      }

      // Pick a random quote from the pool and permanently freeze it to this date
      const randomIndex = Math.floor(Math.random() * coreQuotes.length);
      const chosenQuote = coreQuotes[randomIndex];

      const newRecord = {
        date: dateStr,
        quote: chosenQuote,
        note: existingNote,
        entryIndex: randomIndex + 1
      };

      localStorage.setItem(recordKey, JSON.stringify(newRecord));
      return newRecord;
    }

    const todayKey = getTodayKey();
    let currentRecord = getLockedRecordForDate(todayKey);

    function displayDaily(quote, num) {
      document.getElementById('dexId').textContent = `DEX ENTRY #${String(num).padStart(3, '0')}`;
      document.getElementById('quotePhil').textContent = quote.tradition || "PHILOSOPHY";
      document.getElementById('quoteRegion').textContent = quote.region || "GLOBAL";
      document.getElementById('quoteText').textContent = `"${quote.quote}"`;
      document.getElementById('quoteAuthor').textContent = quote.author;
      document.getElementById('quoteSource').textContent = quote.source || "World Wisdom";
      document.getElementById('quoteContext').textContent = quote.context || "Permanently archived to today's resonance.";
    }

    document.getElementById('todayDate').textContent = todayKey.replace(/-/g, '.');
    displayDaily(currentRecord.quote, currentRecord.entryIndex || 1);

    // Reflection Auto-Save
    const textarea = document.getElementById('reflectionInput');
    const saveStatus = document.getElementById('saveStatus');

    textarea.value = currentRecord.note || '';

    let timeoutId;
    textarea.addEventListener('input', () => {
      saveStatus.textContent = 'SAVING...';
      saveStatus.classList.add('visible');
      clearTimeout(timeoutId);

      timeoutId = setTimeout(() => {
        currentRecord.note = textarea.value;
        localStorage.setItem(`dexicon_entry_${todayKey}`, JSON.stringify(currentRecord));
        // Keep fallback sync for safety
        localStorage.setItem(`dexicon_${todayKey}`, textarea.value);
        saveStatus.textContent = 'SAVED';
        setTimeout(() => saveStatus.classList.remove('visible'), 1200);
      }, 400);
    });

    // Tab Navigation
    const tabDaily = document.getElementById('tabDaily');
    const tabCodex = document.getElementById('tabCodex');
    const viewDaily = document.getElementById('viewDaily');
    const viewCodex = document.getElementById('viewCodex');

    tabDaily.addEventListener('click', () => {
      tabDaily.classList.add('active');
      tabCodex.classList.remove('active');
      viewDaily.style.display = 'flex';
      viewCodex.style.display = 'none';
    });

    tabCodex.addEventListener('click', () => {
      tabCodex.classList.add('active');
      tabDaily.classList.remove('active');
      viewDaily.style.display = 'none';
      viewCodex.style.display = 'flex';
      refreshDeckRandom(); // Fresh true-random shuffle every time
    });

    // Fisher-Yates True Shuffle for Codex
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // World Codex Swiping Engine
    let deckQuotes = [];
    const deckCarousel = document.getElementById('deckCarousel');
    const deckCounter = document.getElementById('deckCounter');
    const prevCardBtn = document.getElementById('prevCardBtn');
    const nextCardBtn = document.getElementById('nextCardBtn');

    function refreshDeckRandom() {
      deckQuotes = shuffleArray(coreQuotes);
      renderDeckCards();
      fetchOnlineDeckQuotes();
    }

    async function fetchOnlineDeckQuotes() {
      try {
        const randomSkip = Math.floor(Math.random() * 80);
        const res = await fetch(`https://dummyjson.com/quotes?limit=25&skip=${randomSkip}`);
        const data = await res.json();
        if (data && data.quotes) {
          const apiFormatted = data.quotes.map(q => ({
            quote: q.quote,
            author: q.author,
            source: "World Literature",
            tradition: "Universal",
            region: "Global",
            context: "Recorded in the global codex."
          }));
          deckQuotes = shuffleArray([...deckQuotes, ...apiFormatted]);
          renderDeckCards();
        }
      } catch (err) {}
    }

    function renderDeckCards() {
      deckCarousel.innerHTML = '';
      deckQuotes.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = 'swipe-card';
        card.innerHTML = `
          <div class="card-body">
            <div class="card-meta">
              <div class="badge-group">
                <span class="type-badge badge-phil">${q.tradition || 'PHILOSOPHY'}</span>
                <span class="type-badge badge-region">${q.region || 'WORLD'}</span>
              </div>
              <span class="date-stamp">#${String(idx + 1).padStart(3, '0')}</span>
            </div>
            <div class="quote-text">"${q.quote}"</div>
            <div class="quote-attribution">
              <span class="author">${q.author}</span><br />
              <span style="font-size:0.75rem;">${q.source || ''}</span>
            </div>
          </div>
          <button class="reflect-action-btn">Reflect on this &rarr;</button>
        `;

        card.querySelector('.reflect-action-btn').addEventListener('click', () => {
          // Lock selected quote to today
          currentRecord.quote = q;
          currentRecord.entryIndex = idx + 1;
          localStorage.setItem(`dexicon_entry_${todayKey}`, JSON.stringify(currentRecord));
          displayDaily(q, idx + 1);
          tabDaily.click();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        deckCarousel.appendChild(card);
      });
      updateDeckIndicator();
    }

    function updateDeckIndicator() {
      if (!deckQuotes.length) return;
      const cardWidth = deckCarousel.offsetWidth || 1;
      const currentIndex = Math.round(deckCarousel.scrollLeft / cardWidth) + 1;
      deckCounter.textContent = `${Math.min(currentIndex, deckQuotes.length)} / ${deckQuotes.length}`;
    }

    deckCarousel.addEventListener('scroll', updateDeckIndicator);

    prevCardBtn.addEventListener('click', () => {
      deckCarousel.scrollBy({ left: -deckCarousel.offsetWidth, behavior: 'smooth' });
    });

    nextCardBtn.addEventListener('click', () => {
      deckCarousel.scrollBy({ left: deckCarousel.offsetWidth, behavior: 'smooth' });
    });

    window.addEventListener('keydown', (e) => {
      if (viewCodex.style.display === 'flex') {
        if (e.key === 'ArrowLeft') prevCardBtn.click();
        if (e.key === 'ArrowRight') nextCardBtn.click();
      }
    });

    // Past Logs Drawer (Permanently displays the locked quote)
    const historyBtn = document.getElementById('toggleHistoryBtn');
    const historyDrawer = document.getElementById('historyDrawer');

    historyBtn.addEventListener('click', () => {
      if (historyDrawer.style.display === 'none') {
        renderHistory();
        historyDrawer.style.display = 'flex';
        historyBtn.textContent = 'Hide Past Logs';
      } else {
        historyDrawer.style.display = 'none';
        historyBtn.textContent = 'View Past Logs';
      }
    });

    function renderHistory() {
      historyDrawer.innerHTML = '';
      
      // Collect dates from both new atomic records and legacy keys
      const dateSet = new Set();
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith('dexicon_entry_')) {
          dateSet.add(k.replace('dexicon_entry_', ''));
        } else if (k.startsWith('dexicon_') && k !== 'dexicon_user_seed') {
          dateSet.add(k.replace('dexicon_', ''));
        }
      }

      const sortedDates = Array.from(dateSet).sort().reverse();

      if (sortedDates.length === 0) {
        historyDrawer.innerHTML = '<div style="font-size:0.75rem; color:var(--text-muted); font-family:var(--font-mono); padding: 0.5rem 0;">No logs found yet. Write today\'s entry above!</div>';
        return;
      }

      let renderedCount = 0;
      sortedDates.forEach(date => {
        const record = getLockedRecordForDate(date);
        if (!record.note || !record.note.trim()) return;

        renderedCount++;
        const card = document.createElement('div');
        card.className = 'history-item';
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:0.7rem; color:var(--text-muted); margin-bottom:0.4rem;">
            <span>${date}</span>
            <span>${record.quote.author}</span>
          </div>
          <div style="font-style:italic; color:#c9d1d9; font-size:0.8rem; margin-bottom:0.4rem;">"${record.quote.quote}"</div>
          <div style="color:var(--text-main); font-size:0.82rem; white-space:pre-wrap;">${escapeHtml(record.note)}</div>
        `;
        historyDrawer.appendChild(card);
      });

      if (renderedCount === 0) {
        historyDrawer.innerHTML = '<div style="font-size:0.75rem; color:var(--text-muted); font-family:var(--font-mono); padding: 0.5rem 0;">No logs found yet. Write today\'s entry above!</div>';
      }
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    // Export Backup
    document.getElementById('exportBtn').addEventListener('click', () => {
      const exportData = {};
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('dexicon_entry_')) {
          const date = key.replace('dexicon_entry_', '');
          try {
            exportData[date] = JSON.parse(localStorage.getItem(key));
          } catch(e) {}
        }
      }
      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `dexicon-backup-${todayKey}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
